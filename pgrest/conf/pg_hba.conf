# =============================================================================
# pg_hba.conf  -  PostgreSQL 18 client authentication (PostgREST stack)
# =============================================================================
# FIRST matching line wins, so order matters.
#
# NO PostgreSQL-native OAuth here (that is the pgdocker stack). Authentication is
# performed by PostgREST IN FRONT of this database: PostgREST verifies the OIDC
# bearer token against the issuer's JWKS, then connects over SCRAM as
# `semantius_authenticator` and SET ROLEs into `authenticated` (valid token) or
# `anon` (no token) per request.
#
# Two ways in:
#   1. `postgres`                - full-DBA login (SCRAM). DATABASE_URL / the CLI.
#   2. `semantius_authenticator` - PostgREST's "authenticator" login (SCRAM). It is
#                                  NOSUPERUSER/NOINHERIT and can only SET ROLE into
#                                  `authenticated` (RLS subject) or `anon`.
#
# Keep the local `trust` line: the container init scripts run over the local
# socket, and it is the break-glass path.
# -----------------------------------------------------------------------------

# TYPE   DATABASE   USER                     ADDRESS        METHOD

# --- Local socket: container init scripts + superuser break-glass ------------
local    all        all                                     trust

# --- Full-DBA login over TCP (password / SCRAM) ------------------------------
host     all        postgres                 0.0.0.0/0      scram-sha-256
host     all        postgres                 ::0/0          scram-sha-256

# --- PostgREST authenticator login over TCP (password / SCRAM) ---------------
# Plain `host` (no TLS) for localhost / the Docker network — switch to `hostssl`
# for any non-local deployment (the SCRAM password is sensitive).
host     all        semantius_authenticator  0.0.0.0/0      scram-sha-256
host     all        semantius_authenticator  ::0/0          scram-sha-256
