# =============================================================================
# pg_ident.conf  -  OAuth identity -> Postgres role mapping
# =============================================================================
# pg_oidc_validator extracts an identity from each validated token (the `sub`
# claim by default; change with pg_oidc_validator.authn_field). The `map=oidc`
# option on the oauth line in pg_hba.conf then runs that identity through the
# rule below.
#
# We map EVERY validated identity to the single `authenticated` role - exactly
# the role Supabase / Neon route authenticated end users through. The token's
# own `sub` (e.g. "user1") still identifies the individual user to the
# application via the JWT claims (see README.md: bridging claims into RLS).
#
# To restrict access to specific subjects instead, replace the catch-all regex,
# e.g.:   oidc   /^(user1|user2)$   authenticated
# -----------------------------------------------------------------------------

# MAPNAME   SYSTEM-USERNAME      PG-USERNAME
oidc        /^(.*)$              authenticated
