# =============================================================================
# pg_hba.conf  -  PostgreSQL 18 client authentication
# =============================================================================
# FIRST matching line wins, so order matters.
#
# Two roles, two ways in (see README.md):
#
#   1. `postgres`        - the full-DBA login. Password (SCRAM) auth. This is
#                          what DATABASE_URL points at for migrations / admin
#                          (the Semantius CLI, psql, etc).
#
#   2. `authenticated`   - the runtime role that OAuth bearer tokens map to.
#                          This is the SAME role name Supabase and Neon use for
#                          authenticated end-user requests. Tokens are verified
#                          against the OIDC issuer's JWKS by pg_oidc_validator,
#                          then mapped to this role via pg_ident.conf (map=oidc).
#
# Keep the local `trust` line: the container's init scripts run over the local
# socket, and it is the break-glass path if the validator is ever misconfigured.
# -----------------------------------------------------------------------------

# TYPE   DATABASE   USER            ADDRESS        METHOD          [OPTIONS]

# --- Local socket: container init scripts + superuser break-glass ------------
local    all        all                            trust

# --- Full-DBA login over TCP (password / SCRAM) ------------------------------
host     all        postgres        0.0.0.0/0      scram-sha-256
host     all        postgres        ::0/0          scram-sha-256

# --- Session-mode login over TCP (password / SCRAM) --------------------------
#
#   semantius_authenticator - the restricted login role used by DB_AUTH_MODE=session.
#       The app connects as this role (password/SCRAM), then per transaction does
#       `SET LOCAL ROLE authenticated` + injects request.jwt.claims. It is
#       NOSUPERUSER/NOINHERIT/NOBYPASSRLS, so on its own it can do nothing but
#       SET ROLE authenticated — it ENFORCES RLS, never bypasses it.
#
# Distinct user from the lines above, so order relative to them is irrelevant.
# Plain `host` (no TLS) for localhost / the Docker network — switch to `hostssl`
# for any non-local deployment (the SCRAM password is sensitive). Managed
# Supabase/Neon manage their own pg_hba and already allow SCRAM for non-superuser
# roles, so this block is local-stack only.
host     all        semantius_authenticator  0.0.0.0/0   scram-sha-256
host     all        semantius_authenticator  ::0/0       scram-sha-256

# --- OAuth / JWT for application connections (role: authenticated) -----------
#
#   issuer    = OIDC issuer. The validator resolves the JWKS via
#               <issuer>/.well-known/openid-configuration -> jwks_uri, then
#               verifies each token's RS256 signature against those keys.
#   scope     = scope(s) the access token must carry (the test issuer mints
#               "openid profile email"). Set to "" to skip scope enforcement.
#   validator = the loaded validator library (see oauth_validator_libraries).
#   map       = pg_ident.conf map that translates the token identity claim
#               (default: "sub") into the Postgres role being connected as.
#
# These are plain `host` (no TLS) so it works out of the box on localhost / the
# Docker network. The OAuth bearer token is sensitive: for any non-local
# deployment configure server certs and switch `host` -> `hostssl`. The issuer /
# JWKS endpoints themselves must be HTTPS (PostgreSQL enforces this).
#
# !!! TEST ISSUER ONLY — REPLACE BEFORE ANY REAL DEPLOYMENT !!!
# `https://oidc-test.semanti.us` is a public, throwaway OIDC test server. It mints
# tokens for anyone with no login, so it holds NO secrets or passwords — nothing
# behind it is private by design. It exists only to exercise the OAuth path. Point
# `issuer=` at your own trusted issuer before deploying anything that matters.
# -----------------------------------------------------------------------------
host     all        authenticated   0.0.0.0/0      oauth   issuer="https://oidc-test.semanti.us" scope="openid" validator="pg_oidc_validator" map="oidc"
host     all        authenticated   ::0/0          oauth   issuer="https://oidc-test.semanti.us" scope="openid" validator="pg_oidc_validator" map="oidc"
