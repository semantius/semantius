# GENERATED FILE — DO NOT EDIT.
# Built from ../docker-compose.yml + ../Caddyfile + ../idp-config/*.jsonc by
# `./dokploy-build.sh` (scripts/dokploy-build.mjs). Change those, then regenerate.

# The Dokploy blueprint variant of the semantius stack. Same services as the
# local-dev compose, minus everything a one-click deployment must not carry:
# host `ports:` (Dokploy's Traefik routes to the `caddy` service by name — see
# template.toml's [[config.domains]]), `container_name:` (would collide across
# deployments) and bind mounts (the Caddyfile and the identity provider's
# configuration are embedded in the top-level `configs:` block below, so
# `mounts = []` in the template).

# One further difference, forced rather than chosen: a service carrying an inline
# `content:` config cannot also be `read_only`, because compose delivers such a
# config by writing it into the container filesystem. `read_only` is therefore
# dropped from those services here — cap_drop, no-new-privileges and the tmpfs
# are not.

# Requires docker compose >= 2.23.1 on the target server (inline configs.content).

name: semantius

services:
  # --- PostgreSQL 18 + extension --------------------------------------------
  postgres:
    # Self-contained image (../docker-postgres): PostgreSQL 18 with the extension
    # INSTALLED, plus pg_hba, the roles, the authenticator LOGIN, and an optional
    # Northwind demo module all baked in. NOTHING is mounted from the host — this
    # stack is just this compose file + .env (a copy-paste Dokploy template).
    # Locally, docker-postgres/build.sh tags :latest so `up` uses your fresh
    # build; on a server it is pulled from GHCR. Pin the version via SEMANTIUS_DB_VERSION.
    image: ghcr.io/semantius/postgres:${SEMANTIUS_DB_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-semantius}
      # Read by the image's baked 20-authenticator-login.sh AND by PostgREST below
      # (PGRST_DB_URI) — keep the two in sync.
      SEMANTIUS_AUTHENTICATOR_PASSWORD: ${SEMANTIUS_AUTHENTICATOR_PASSWORD:-devpassword}
      # Set to any value (e.g. TRUE) to load the optional Northwind demo module on
      # first init (the image's baked 40-nwind.sh). Leave unset for an empty DB.
      # Only takes effect on a FRESH data volume — init scripts run once.
      NWIND: ${NWIND:-}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      # `-h 127.0.0.1` FORCES A TCP CHECK, and that is the whole point. A bare
      # `pg_isready` talks over the unix socket, which starts answering during the
      # image's FIRST-INIT phase — while the server runs with listen_addresses=''
      # and refuses every TCP client. On a fresh volume that gap is over a minute,
      # and `depends_on: service_healthy` hands it to services that then fail to
      # connect (PostgREST survives it by retrying in a loop; the idp does not).
      # start_period covers the init — extension install, roles, the optional
      # NWIND load — without those failures counting toward `retries`.
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${POSTGRES_DB:-semantius}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  # --- PgBouncer (pooled endpoint for external apps + the idp) ---------------
  # Transaction-pooled endpoint, for transaction-pooling-safe usage only (the SET
  # LOCAL ROLE pattern, see pgdocker/README.md). It pools TWO logins:
  #   `semantius_authenticator`  external apps talking SQL directly, on the
  #                              published PGBOUNCER_PORT;
  #   `postgres`                 the RUNTIME connection of the bundled idp below
  #                              (its DATABASE_URL). The idp's startup, migrations,
  #                              CLI and cleanup job hold SESSION advisory locks,
  #                              which do not survive a pooler — those use
  #                              DATABASE_URL_ADMIN, direct to postgres:5432.
  # PostgREST still connects to postgres directly as well: it needs LISTEN/NOTIFY
  # (PGRST_DB_CHANNEL), which transaction pooling does not support.
  #
  # DATABASE_URLS (plural) is edoburu/pgbouncer's MULTI-USER form: the entrypoint
  # parses each comma-separated URL and appends one userlist.txt entry per distinct
  # user — env only, no mounted userlist to keep in step. Two caveats it earns:
  # that parser is naive (grep/cut), so every password spliced in here must be
  # URL-SAFE (no @ : / ? # or spaces); and both URLs name the same database, so
  # `[databases]` gets a duplicate key — harmless, the two entries differ only in
  # `auth_user`, which goes unused once both users are in the userlist.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URLS: "postgres://semantius_authenticator:${SEMANTIUS_AUTHENTICATOR_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-semantius},postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-semantius}"
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      # PgBouncer REJECTS a startup parameter it does not know, with a FATAL
      # "unsupported startup parameter"; listing one here makes it ignore the
      # parameter instead of the connection. `search_path` is on the list because
      # the idp's driver sends one as a best-effort convenience — every query it
      # emits is schema-qualified, so dropping it changes nothing — and without
      # this every idp query through the pooler dies at connect. The image's own
      # default is `extra_float_digits` alone, so it has to be repeated here.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path

  # --- Identity provider (the bundled OIDC/OAuth issuer) ---------------------
  # semantius-idp: this stack's DEFAULT issuer. It signs the bearer tokens the SPA
  # sends and publishes the JWKS PostgREST validates them against, so the stack
  # owns its whole auth story out of the box — no external IdP, no public throwaway
  # test issuer.
  #
  # MOUNTED AT /idp on the caddy front door (see ../Caddyfile), and the prefix is
  # NOT stripped: `server.baseUrl` in idp-config/config.jsonc carries it, and every
  # link, cookie Path, e-mail URL and redirect the idp emits derives from that one
  # value. Its discovery documents are ALSO served from the ORIGIN ROOT
  # (/.well-known/*), because a client handed the issuer <origin>/idp looks for
  # metadata there and never under the mount path (RFC 8414 §3.1).
  #
  # SHARES this stack's Postgres, in its own `idp` schema, and migrates itself on
  # boot. Two connection strings, both as the `postgres` superuser for now:
  #   DATABASE_URL        runtime traffic, THROUGH pgbouncer. Safe under transaction
  #                       pooling: the idp's driver disables prepared statements and
  #                       schema-qualifies every query.
  #   DATABASE_URL_ADMIN  DIRECT to postgres:5432 — startup, migrations, the CLI and
  #                       the cleanup job hold SESSION advisory locks, which a
  #                       transaction pooler does not preserve.
  #
  # CONFIG is the sibling ./idp-config/ (config.jsonc + oauth_clients.jsonc), bind
  # mounted READ-ONLY: the container never writes its own configuration, so
  # "restart to apply" is a property of the mount rather than a promise in the
  # documentation. The `${env:...}` placeholders inside those files resolve from
  # the environment below.
  #
  # FIRST RUN: no bootstrap account, and no password in the environment. While the
  # user table is empty the idp serves a setup page at /idp — whoever completes it
  # becomes the first administrator.
  idp:
    image: ghcr.io/semantius/semantius-idp:${SEMANTIUS_IDP_VERSION:-latest}
    # `always` keeps a released tag honest — it is re-pulled on every create/up.
    # A LOCALLY BUILT image needs `missing`, or the pull clobbers it with the
    # registry's copy of the same tag (or fails, when the tag was never pushed).
    pull_policy: ${IDP_PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      postgres:
        # service_healthy, not merely started: the idp migrates on boot, and a
        # migration against a Postgres still running initdb fails the whole start.
        condition: service_healthy
      pgbouncer:
        condition: service_started
    environment:
      # Where the config files live INSIDE the container (the mount below). Pinned
      # here rather than defaulted, so a host IDP_CONFIG_DIR naming a host path
      # cannot send the container looking for a directory that does not exist in it.
      IDP_CONFIG_DIR: /config
      # Every idp table — drizzle's migration bookkeeping included — lives in this
      # schema. Nothing is created in `public`, so nothing can collide with
      # pg_semantius's own objects.
      IDP_SCHEMA_NAME: idp
      # THE ISSUER: scheme + host[:port] + the /idp mount path, no trailing slash.
      # Everything absolute the idp emits derives from this, and it is also the
      # default `aud` of its access tokens (jwt.audience in config.jsonc). Going
      # live, set IDP_BASE_URL=https://yourdomain.com/idp in .env.
      IDP_BASE_URL: ${IDP_BASE_URL:-http://localhost:${WEB_PORT:-3000}/idp}
      # What the healthcheck below probes. Two things about this URL:
      #
      # /readyz, NOT /healthz. /healthz is liveness — "the process is up" — and it
      # answers 200 while the database is still refusing connections. jwks-fetch
      # waits on THIS service being healthy before downloading the signing keys, so
      # a liveness probe lets it fire at an idp that 500s, and a one-shot container
      # that fails is a failed `create`. /readyz checks config, database,
      # migrations AND the signing key — which is exactly the precondition.
      #
      # It must carry the SAME path prefix as IDP_BASE_URL: under a sub-path
      # /readyz sits at /idp/readyz, and a probe of the origin root would report a
      # perfectly healthy container as failing.
      IDP_HEALTH_URL: http://127.0.0.1:3000/idp/readyz
      # Signs sessions AND encrypts the JWT signing keys at rest. Rotating it logs
      # everyone out and makes the stored signing keys undecryptable — read the
      # idp's key-rotation runbook before you do. >= 32 random bytes:
      # `openssl rand -base64 48`.
      IDP_SECRET: ${IDP_SECRET:?set IDP_SECRET in .env (openssl rand -base64 48)}
      # Runtime pooled / admin direct, as described above. The password is spliced
      # into a URL, so POSTGRES_PASSWORD must be URL-safe.
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@pgbouncer:5432/${POSTGRES_DB:-semantius}
      DATABASE_URL_ADMIN: postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-semantius}
      # ORIGIN of the admin SPA — no path, no trailing slash.
      # idp-config/oauth_clients.jsonc builds the SPA's redirect URIs from it, and
      # those are matched EXACTLY, so it has to be the origin the browser really uses.
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      # Optional. Without it the idp runs DEGRADED: password reset, e-mail
      # verification and every notification are disabled and hidden in the UI (and
      # auth.requireEmailVerification is forced off). Fine locally, where an admin
      # creates the accounts; set it for anything people depend on.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    tmpfs:
      - /tmp:mode=1777,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Longer than the idp's own drain (server.shutdownTimeoutSeconds, 10s by
    # default), or Docker kills the process in the middle of the thing that exists
    # to avoid being killed in the middle.
    stop_grace_period: 30s
    healthcheck:
      # The image is a Bun runtime with no shell utilities in it — no curl, no wget.
      test: [ "CMD", "bun", "-e", "const r = await fetch(process.env.IDP_HEALTH_URL); process.exit(r.ok ? 0 : 1)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      # Generous, because a FIRST boot is a schema creation, a full migration run
      # and an ES256 key generation before /readyz can answer — and because these
      # failures are what `create` would report as "dependency failed to start".
      start_period: 90s
    # The identity provider's configuration, embedded at the bottom of this file
    # (no bind mounts in a blueprint). Edit ../idp-config/*.jsonc and regenerate
    # — never these copies. Restarting the service applies a change.

    # An inline config is written into the container filesystem, so this service
    # cannot also be `read_only` — it is dropped in this generated variant and
    # nowhere else. cap_drop, no-new-privileges and the tmpfs are unchanged.
    configs:
      - source: idp_config
        target: /config/config.jsonc
      - source: idp_oauth_clients
        target: /config/oauth_clients.jsonc

  # --- One-shot: fetch the issuer JWKS to a file PostgREST can read ----------
  # PostgREST CANNOT fetch a JWKS from a URL; jwt-secret only takes inline JSON or
  # @/path/to/file. So fetch it once at startup into the shared `jwks` volume.
  # Runs as root (user 0:0) so it can write to the fresh named volume (owned by
  # root); curl writes jwks.json world-readable, so PostgREST (a different user)
  # can read it.
  #
  # KEYS URL: JWKS_URL, when set, is fetched directly. It DEFAULTS to the bundled
  # idp reached IN-NETWORK (http://idp:3000/idp/.well-known/jwks.json) —
  # deliberately explicit rather than derived, because the `jwks_uri` the idp
  # advertises is built from its PUBLIC baseUrl (localhost:WEB_PORT), an address
  # this container cannot resolve.
  #
  # For an EXTERNAL issuer, set JWKS_URL empty and VITE_OAUTH_CONFIG to that
  # issuer's discovery URL: an empty JWKS_URL makes this service DERIVE the keys
  # URL from the discovery document's `jwks_uri`, so the issuer is named once.
  #
  # LIMITATION: fetched ONCE per start. When the issuer ROTATES signing keys, tokens
  # signed by a new key fail until this is re-run AND PostgREST is restarted to
  # re-read the file — do both with ./jwks-refresh.sh (.cmd). A restart, not
  # a reload signal, is required: the key comes from the PGRST_JWT_SECRET env var,
  # which PostgREST does not re-read on a config reload. Most IdPs rotate slowly, so
  # on demand is enough; schedule the refresh (daily cron) for a fast-rotating IdP.
  # Fail-closed: if the issuer/discovery is unreachable, this exits non-zero and
  # PostgREST won't start (its depends_on service_completed_successfully).
  jwks-fetch:
    image: curlimages/curl:latest
    pull_policy: always
    user: "0:0"
    restart: "no"
    depends_on:
      idp:
        # The default JWKS_URL points at the idp, so it has to be serving keys
        # before this runs. Harmless when the two vars below name an external
        # issuer — the idp is part of the stack either way.
        condition: service_healthy
    environment:
      # Defaults to the bundled idp, in-network. `-` and NOT `:-`, deliberately:
      # the default applies only when JWKS_URL is UNSET, so an EMPTY `JWKS_URL=`
      # in .env survives as empty and selects the derive-from-discovery path
      # below. With `:-` an empty value would silently take the default back and
      # the external-issuer route would be unreachable.
      JWKS_URL: ${JWKS_URL-http://idp:3000/idp/.well-known/jwks.json}
      # Only consulted when JWKS_URL is empty. Defaults to the front door's origin
      # root, which caddy routes to the bundled idp.
      VITE_OAUTH_CONFIG: ${VITE_OAUTH_CONFIG:-http://localhost:${WEB_PORT:-3000}/.well-known/openid-configuration}
    volumes:
      - jwks:/jwks
    entrypoint:
      - "sh"
      - "-c"
      - |
        set -e
        url="$${JWKS_URL}"
        if [ -z "$${url}" ]; then
          if [ -z "$${VITE_OAUTH_CONFIG}" ]; then
            echo "ERROR: set JWKS_URL, or VITE_OAUTH_CONFIG (the OIDC discovery URL)." >&2
            exit 1
          fi
          echo "JWKS_URL empty — discovering jwks_uri from $${VITE_OAUTH_CONFIG} ..."
          url="$$(curl -fsS --retry 5 --retry-connrefused --retry-all-errors "$${VITE_OAUTH_CONFIG}" \
                  | tr -d '[:space:]' | sed 's/.*"jwks_uri":"//; s/".*//')"
          case "$${url}" in
            http://*|https://*) echo "Discovered jwks_uri: $${url}" ;;
            *) echo "ERROR: no jwks_uri in the discovery document at $${VITE_OAUTH_CONFIG}." >&2; exit 1 ;;
          esac
        fi
        echo "Fetching JWKS from $${url} ..."
        # --retry-all-errors as well as --retry-connrefused: an issuer that is
        # listening but not yet able to serve keys answers 500, and without this
        # curl retries the connection failure but not the HTTP error.
        curl -fsS --retry 5 --retry-connrefused --retry-all-errors "$${url}" -o /jwks/jwks.json
        echo "JWKS written to /jwks/jwks.json:"
        cat /jwks/jwks.json

  # --- PostgREST -------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      jwks-fetch:
        condition: service_completed_successfully
    environment:
      # Connect as the authenticator; PostgREST SET ROLEs into authenticated/anon.
      # Password must match SEMANTIUS_AUTHENTICATOR_PASSWORD above.
      PGRST_DB_URI: "postgres://semantius_authenticator:${SEMANTIUS_AUTHENTICATOR_PASSWORD:-devpassword}@postgres:5432/${POSTGRES_DB:-semantius}"
      PGRST_DB_SCHEMAS: "public"
      PGRST_DB_ANON_ROLE: "anon"
      # JWKS from a FILE (PostgREST can't take a URL). @-prefix = read from file.
      PGRST_JWT_SECRET: "@/jwks/jwks.json"
      # The JWT `role` claim selects the DB role (default claim key = .role). The
      # bundled idp mints "role":"authenticated" into every access token (a static
      # claim — `jwt.claims` in idp-config/config.jsonc), so it maps automatically;
      # an external issuer has to be configured to emit the same claim.
      PGRST_JWT_ROLE_CLAIM_KEY: ".role"
      # Emit the FULL OpenAPI spec regardless of the requesting role's privileges,
      # so the token-less docs site sees every endpoint while `anon` still has no
      # data access (locked down in init/12-anon-role.sh).
      PGRST_OPENAPI_MODE: "ignore-privileges"
      # Include securityDefinitions (JWT bearer, Authorization header) in the spec
      # so the Scalar docs render an "Authentication" box for pasting a token.
      # Mint one with ./token.sh <user>.
      PGRST_OPENAPI_SECURITY_ACTIVE: "true"
      # Honour the CLI's `NOTIFY pgrst, 'reload schema'` after each migration.
      PGRST_DB_CHANNEL_ENABLED: "true"
      PGRST_DB_CHANNEL: "pgrst"
      PGRST_SERVER_PORT: "3000"
      # The host the spec advertises to clients. Without this PostgREST emits its
      # bind address (0.0.0.0:3000), so the docs' "Test Request" calls
      # http://0.0.0.0:3000/... which the browser rejects (ERR_ADDRESS_INVALID).
      # The browser resolves this URL, so it must be browser-reachable — NOT the
      # in-network `postgrest` hostname. The default is this stack's OWN front door
      # (caddy on WEB_PORT) — its `handle_path /api/*` strips the prefix before
      # proxying here, so the spec advertises basePath=/api, the browser calls
      # /api/..., caddy strips /api and PostgREST sees /... . Going live, set
      # PUBLIC_API_URL to the PUBLIC front-door URL INCLUDING the /api prefix, e.g.
      # https://yourdomain.com/api. See README / .env.example.
      PGRST_OPENAPI_SERVER_PROXY_URI: "${PUBLIC_API_URL:-http://localhost:${WEB_PORT:-3000}/api}"
      # PGRST_JWT_AUD left unset: rbac.uid() enforces aud in-DB (same as bearer
      # mode). Set it to one of the token's aud values to also check at this layer.
    volumes:
      - jwks:/jwks:ro

  # --- Scalar API reference (OpenAPI docs) -----------------------------------
  # Renders PostgREST's Swagger 2.0 spec. The `url` is fetched by the BROWSER, so
  # it must be browser-reachable — the stack's own front door (`/api/` on caddy,
  # the default) or your public /api URL — NOT the in-network `postgrest` hostname.
  # Keep it in sync with PGRST_OPENAPI_SERVER_PROXY_URI above via the same
  # PUBLIC_API_URL. Reached through the front door at /api-docs/ this is same-origin
  # with the spec, so it no longer depends on PostgREST's permissive CORS. The host
  # port below stays published for direct access / back-compat.
  scalar:
    image: scalarapi/api-reference:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgrest:
        condition: service_started
    environment:
      API_REFERENCE_CONFIG: '{"sources":[{"url":"${PUBLIC_API_URL:-http://localhost:${WEB_PORT:-3000}/api}/","title":"Semantius API"}]}'

  # --- Admin SPA -------------------------------------------------------------
  # Static single-page admin app (nginx, container port 80). SPA ONLY — it does no
  # proxying of its own; the `caddy` front door below routes /api/* and /api-docs/*
  # and falls through to here for everything else. Deliberately NOT published on a
  # host port — reach it through caddy on WEB_PORT. Runtime config is generated
  # into config.js at container start from the VITE_* env below (the image's
  # gen-config.sh), so one image serves every environment.
  web:
    image: ghcr.io/semantius/semantius-app:${SEMANTIUS_APP_VERSION:-latest}
    # Re-pull :latest on every `up` (create). Without this, compose only
    # pulls when the image is missing locally, so create would keep running a stale
    # cached SPA. NOT set on `postgres`, which is built locally by build.sh.
    pull_policy: always
    restart: unless-stopped
    environment:
      # Same-origin API base: the browser calls http://<host>:${WEB_PORT}/api/...
      # and caddy proxies /api/* -> postgrest:3000 with the prefix stripped, so no
      # CORS and no need to publish PostgREST's port. Doesn't change going live.
      VITE_API_BASE_URL: /api
      # OIDC discovery URL + client id — the SPA resolves the OAuth endpoints from
      # this at boot. Both default to the BUNDLED idp: caddy serves its discovery
      # document from the front door's ORIGIN ROOT, and `public-client` is the SPA
      # registered in ./idp-config/oauth_clients.jsonc. Going live there is nothing
      # to change here — set IDP_BASE_URL / PUBLIC_WEB_ORIGIN to your domain and
      # leave these alone — unless you are replacing the issuer, in which case point
      # them at yours (and see JWKS_URL on jwks-fetch above).
      VITE_OAUTH_CONFIG: ${VITE_OAUTH_CONFIG:-http://localhost:${WEB_PORT:-3000}/.well-known/openid-configuration}
      VITE_OAUTH_CLIENT_ID: ${VITE_OAUTH_CLIENT_ID:-public-client}
      # The RFC 8707 resource the SPA asks its access tokens to be issued FOR —
      # it becomes their `aud`. LOAD-BEARING: the SPA always sends one, falling
      # back to a built-in placeholder (`web://api`) when this is empty, and the
      # idp rejects a resource it has never heard of with
      # `invalid_target: requested resource not authorized` — a "Login Error" on
      # the callback page and nothing in the SPA to explain it. So name the idp's
      # registered default audience, which is the issuer itself (`jwt.audience`
      # in idp-config/config.jsonc, also defaulted from IDP_BASE_URL). With an
      # external issuer, set VITE_OAUTH_AUDIENCE in .env to the audience that
      # issuer expects — or to its issuer URL if it has no separate API audience.
      # `-` and not `:-` again: an explicitly EMPTY VITE_OAUTH_AUDIENCE has to
      # reach the SPA as empty, which is how you ask for its own built-in fallback.
      VITE_OAUTH_AUDIENCE: ${VITE_OAUTH_AUDIENCE-${IDP_BASE_URL:-http://localhost:${WEB_PORT:-3000}/idp}}
      # SINGLE SPACE — LOAD-BEARING, do not "tidy" it to "" or delete the line. The
      # SPA's cloud control plane is opt-OUT: an UNSET **or EMPTY** value still
      # activates it (the runtime-env reader ignores empty strings and falls through
      # to the build-time default https://app.semantius.com), which sends the SPA to
      # api.semantius.cloud for a tenant lookup -> blocking boot error when
      # self-hosted. A whitespace value survives that filter and .trim()s to "" in
      # the app -> true self-hosted mode (OAuth endpoints from VITE_OAUTH_CONFIG
      # discovery, the API from VITE_API_BASE_URL).
      VITE_CONTROL_PLANE_URL: " "
      # Ignore the image's baked demo placeholders so a missing var fails loudly
      # instead of silently using .env.example defaults (e.g. your-postgrest-api.com).
      ENV_FILE: /dev/null
    healthcheck:
      # busybox wget — the nginx:alpine base has no curl.
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Caddy front door ------------------------------------------------------
  # The single public entrypoint. Routes (see the sibling ./Caddyfile):
  #   /              -> web:80          (the SPA)
  #   /api/*         -> postgrest:3000  (prefix stripped by handle_path)
  #   /api-docs/*    -> scalar:8080     (prefix stripped by handle_path)
  #   /idp/*         -> idp:3000        (prefix KEPT — it is part of the issuer URL)
  #   /.well-known/* -> idp:3000        (rewritten under /idp: the issuer's metadata
  #                                      has to live at the origin root)
  # No depends_on: Caddy re-resolves upstream DNS per request, so an upstream that
  # hasn't started yet is a brief 502 that self-heals — no start-order coupling.
  caddy:
    image: caddy:2-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      # ":80" = plain HTTP (local, or TLS terminated by Dokploy/Traefik in front).
      # Set a bare domain in .env for Caddy auto-HTTPS on a bare VPS (then publish
      # 80:80 + 443:443 below instead of WEB_PORT).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # Certificate/ACME store + autosaved config — only meaningful when
      # SITE_ADDRESS is a real domain (auto-HTTPS); harmless otherwise.
      - caddy_data:/data
      - caddy_config:/config
    # The Caddyfile, embedded at the bottom of this file (no bind mounts in a
    # blueprint). Edit ../Caddyfile and regenerate — never this copy.
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile

volumes:
  pgdata:
  jwks:
  caddy_data:
  caddy_config:
# The bind-mounted files, copied verbatim from ../Caddyfile and
# ../idp-config/*.jsonc at build time. `$` is escaped as `$$` so compose
# leaves Caddy's own {$SITE_ADDRESS::80} and the idp's ${env:...} placeholders
# alone — each is resolved by its own reader, from that service's environment.
# Needs docker compose >= 2.23.1 (inline `content:` support).
configs:
  caddyfile:
    content: |
      # Front door for the semantius-rest stack. SITE_ADDRESS comes from the compose
      # (default ":80" — plain HTTP; TLS terminated by Dokploy/Traefik or use a bare
      # domain for Caddy auto-HTTPS on a bare VPS, then publish 80/443).
      {$$SITE_ADDRESS::80} {
      	encode zstd gzip

      	# Bare /api, /api-docs or /idp wouldn't match the /*-suffixed matchers below
      	# and would fall through to the SPA — bounce to the canonical slash form
      	# (redir sorts before handle/handle_path in Caddy's directive order; 308
      	# keeps the method).
      	redir /api /api/ 308
      	redir /api-docs /api-docs/ 308
      	redir /idp /idp/ 308

      	# /gateway/<name> is the idp's authenticating reverse proxy. It lives at
      	# /idp/gateway upstream, like the rest of the app; this serves it at the
      	# short root-level form instead.
      	#
      	# A `rewrite`, so the caller's URL stays /gateway — and that is only correct
      	# because the idp's session cookie is scoped to the WHOLE HOST. It was
      	# scoped to /idp until the idp's **D97**, and under that scoping this had to
      	# be a 308 to /idp/gateway: a rewrite would have kept the caller outside the
      	# cookie's Path, the browser would have stopped attaching the session, and
      	# the proxy treats a missing session as ANONYMOUS rather than as a refusal
      	# (`sessionCredential`, server/gateways/proxy.ts) — so cookie-authenticated
      	# calls would have quietly downgraded instead of failing.
      	#
      	# If `server.cookiePath` is ever narrowed back to /idp in idp-config, this
      	# block has to go back to being a redirect, or come out.
      	handle /gateway* {
      		rewrite * /idp{uri}
      		reverse_proxy idp:3000
      	}

      	handle_path /api/* {
      		reverse_proxy postgrest:3000
      	}
      	handle_path /api-docs/* {
      		reverse_proxy scalar:8080
      	}

      	# --- the identity provider ----------------------------------------------
      	#
      	# Two rules, and both are easy to get wrong in ways that fail quietly.
      	#
      	# 1. The idp is served at /idp WITHOUT stripping the prefix — `handle`, never
      	#    `handle_path`. Its `server.baseUrl` carries /idp and it renders every
      	#    link, cookie Path, e-mail URL and redirect from that value; strip the
      	#    prefix here and all of them point one level too high, so sign-in appears
      	#    to work while the session cookie is set on a path the browser never
      	#    sends back.
      	#
      	# 2. The discovery documents are served from the ORIGIN ROOT, which belongs to
      	#    the SPA. A client handed the issuer `<origin>/idp` does NOT fetch
      	#    `{issuer}/.well-known/...`: RFC 8414 §3.1 inserts the well-known segment
      	#    BETWEEN the host and the path, so it asks for
      	#    `<origin>/.well-known/oauth-authorization-server/idp`. Both spellings of
      	#    the suffix form are routed below, plus the plain `/.well-known/*` root
      	#    form that this stack's own SPA and jwks tooling use. Nothing does this
      	#    for you, and the symptom is a client that cannot discover an idp which is
      	#    otherwise working perfectly.
      	#
      	# Caddy sorts `handle` blocks by matcher specificity, so the two suffix forms
      	# win over the general /.well-known/* below regardless of the order here.
      	handle /.well-known/oauth-authorization-server/idp* {
      		rewrite * /idp/.well-known/oauth-authorization-server
      		reverse_proxy idp:3000
      	}
      	handle /.well-known/openid-configuration/idp* {
      		rewrite * /idp/.well-known/openid-configuration
      		reverse_proxy idp:3000
      	}
      	# The root form: /.well-known/openid-configuration, /.well-known/jwks.json and
      	# anything else the idp publishes there, re-prefixed onto its mount path.
      	handle /.well-known/* {
      		rewrite * /idp{uri}
      		reverse_proxy idp:3000
      	}
      	handle /idp/* {
      		reverse_proxy idp:3000
      	}

      	handle {
      		reverse_proxy web:80
      	}
      }
  idp_config:
    content: |
      // Configuration for the bundled `idp` service (semantius-idp) — this stack's
      // default OIDC/OAuth issuer. Bind-mounted READ-ONLY at /config in the container.
      //
      // JSONC: comments and trailing commas are allowed. Any string value may carry a
      // placeholder, substituted once before validation:
      //
      //   $${env:NAME}            required environment variable
      //   $${env:NAME:-default}   with a default, also used when NAME is empty
      //   $${file:/abs/path}      file contents, one trailing newline trimmed
      //   $$$${                    a literal "$${"
      //
      // The environment those read comes from the `idp` service in
      // ../docker-compose.yml, which fills it from ../.env.
      //
      // Read ONCE, at start-up: `docker compose restart idp` to apply a change (there
      // is no hot reload, and SIGHUP is ignored).
      //
      // Only the keys this deployment actually decides are here; everything omitted
      // keeps the idp's own default. The full reference is the table in
      // semantius-idp/docs/configuration.md.
      //
      // The dokploy build (../dokploy-build.sh) EMBEDS this file into the generated
      // compose as a `configs:` entry — regenerate after every change.
      {
        "server": {
          // THE ISSUER. Scheme + host[:port] + the /idp mount path, no trailing slash.
          // Every absolute URL the idp emits — discovery, e-mail links, social
          // callbacks — derives from this and never from the Host header. The cookie
          // Path used to as well; since the idp's D97 it is `cookiePath` below.
          // The default matches caddy's default front door; going live, set
          // IDP_BASE_URL=https://yourdomain.com/idp in .env.
          "baseUrl": "$${env:IDP_BASE_URL:-http://localhost:3000/idp}",
          "host": "0.0.0.0",
          "port": 3000,

          // The idp always sits behind this stack's caddy front door, so honour its
          // X-Forwarded-* (Caddy 2 sets them by default). `true` trusts the immediate
          // upstream only.
          "trustProxy": true,

          // Left at the default `false`, which is right for both shipped cases: an
          // https baseUrl in production, and http://localhost:3000/idp locally —
          // localhost is exempt from the https requirement. Turn it on ONLY for a
          // non-localhost http baseUrl, i.e. reaching a dev stack over a LAN IP
          // (http://192.168.x.x:3000/idp). Never on a real deployment.
          // "allowInsecureHttp": true,

          // trustedOrigins is left out on purpose: empty trusts the address each
          // request actually arrived on (its X-Forwarded-Host), which is what a
          // deployment behind a proxy whose public URL is not known here needs.

          // Session cookie scope (idp D97). Both are left at their defaults here and
          // spelled out because the defaults are the reason /gateway works.
          //
          // cookiePath defaults to "/" — the WHOLE HOST, not the /idp mount. That is
          // what lets caddy serve the gateway at the origin root: a cookie scoped to
          // /idp would not be sent to /gateway/*, and the idp treats a missing
          // session as ANONYMOUS rather than as an error, so the calls would have
          // quietly succeeded as nobody. Narrow it to "/idp" only if you want the
          // session kept off the SPA, /api/* and /api-docs/* on this origin — and
          // then drop the /gateway route from the Caddyfile in the same change.
          // "cookiePath": "/",
          //
          // cookieDomain is unset, which makes the cookie host-only. Set it to a
          // registrable domain to share one session across its subdomains — every
          // host under it can then read and set that session, so only across hosts
          // you control.
          // "cookieDomain": "example.com",

          "shutdownTimeoutSeconds": 10
        },

        // Signs sessions AND encrypts the stored JWT signing keys. >= 32 random bytes:
        // `openssl rand -base64 48`. Rotating it logs everyone out and makes the
        // existing signing keys undecryptable — see the idp's key-rotation runbook.
        "secret": "$${env:IDP_SECRET}",

        "database": {
          // Runtime traffic, through this stack's pgbouncer (transaction pooling).
          // Safe: the idp's driver disables prepared statements and schema-qualifies
          // every query.
          "url": "$${env:DATABASE_URL}",

          // The direct, non-pooled endpoint — REQUIRED whenever `url` is pooled.
          // Startup, migrations, the CLI and the cleanup job hold SESSION advisory
          // locks, which do not survive a transaction-mode pooler, so this is the
          // connection that must always work.
          "directUrl": "$${env:DATABASE_URL_ADMIN}",

          // Every idp table, drizzle's migration bookkeeping included, lives here.
          // Nothing is created in `public`, so nothing collides with pg_semantius.
          "schema": "idp",

          // LOAD-BEARING. `ssl` defaults to `require` for any non-localhost host, and
          // this stack's bundled Postgres speaks plain TCP inside the compose network
          // — without this the idp cannot connect at all.
          "ssl": "disable",

          "poolMax": 10,
          "connectTimeoutSeconds": 30,
          // The idp owns its schema and migrates itself on boot; there is no separate
          // migration step in this stack.
          "migrateOnBoot": true
        },

        "site": {
          "name": "Semantius",
          // What /idp/admin/* calls itself. Branding only — the TOTP issuer label, the
          // e-mails and every token claim stay on `site.name`.
          "adminTitle": "User Manager",
          "theme": "system",
          "defaultLocale": "en-US"
        },

        // No API key ⇒ DEGRADED mode: password reset, e-mail verification and every
        // notification are disabled and hidden in the UI, and
        // auth.requireEmailVerification is forced false. That is the default here and
        // it is fine for local dev, where an administrator creates the accounts. Set
        // RESEND_API_KEY in .env (and a real `from`) for anything people depend on.
        "email": {
          "resend": { "apiKey": "$${env:RESEND_API_KEY:-}" },
          "from": "Semantius <idp@example.com>"
        },

        "auth": {
          // Where a completed sign-in lands when there is no OAuth continuation and no
          // validated returnTo — the first-run setup page and a direct visit to
          // /idp/login are exactly those cases. The idp's own default is "/account",
          // its profile page, which is the wrong destination here: nobody signs in to
          // this stack to look at the identity provider, they sign in to use the admin
          // SPA. An ABSOLUTE URL is supported precisely for this "the idp sits beside
          // the product" arrangement, so send them to the product's root.
          "defaultRedirect": "$${env:PUBLIC_WEB_ORIGIN:-http://localhost:3000}/"
        },

        // Invite-only: administrators create users from /idp/admin. Self-registration
        // is off for both password and social sign-up — an issuer that anyone can
        // register with is exactly what replacing the public test issuer was for.
        "signUp": {
          "enabled": false,
          "requireApproval": true,
          "allowedEmailDomains": []
        },

        "jwt": {
          // PostgREST validates ES256 and RS256 only.
          "algorithm": "ES256",

          // REQUIRED. The default RFC 8707 resource, applied when a client sends no
          // `resource` parameter — it becomes the access token's `aud`. Keep it equal
          // to the issuer. pg_semantius's rbac.uid() checks `aud` only when
          // `_settings.jwt_aud` is seeded (off by default); if you seed it, seed it
          // with EXACTLY this value.
          "audience": "$${env:IDP_BASE_URL:-http://localhost:3000/idp}",

          // THIS is what makes PostgREST accept the token: a static `role` claim in
          // every access token, which PostgREST reads (PGRST_JWT_ROLE_CLAIM_KEY=.role)
          // and SET ROLEs into. Without it every request falls back to `anon` and gets
          // "permission denied". A static claim belongs here and NOT in roles.jsonc —
          // that file is the per-user role catalog, emitted as the `roles` array.
          "claims": {
            "role": "authenticated"
          },
          "claimsInIdToken": false,

          "includeUserData": true,
          "rotationInterval": "90d",

          // TTL of the JWT from GET {baseUrl}/api/auth/token — the first-party session
          // exchange, and the way to mint a token for curl from an API key.
          "sessionToken": { "ttl": 3600 }
        },

        "oauth": {
          "accessTokenTtl": "15m",
          "idTokenTtl": "1h",
          "codeTtl": "60s",
          "refreshTokenTtl": "30d",
          "refreshTokenMaxLifetime": "90d",
          // A client in oauth_clients.jsonc may only reference scopes declared here.
          "scopes": ["openid", "profile", "email", "offline_access"],
          // false: a client removed from oauth_clients.jsonc is disabled and its tokens
          // revoked. true deletes its rows instead.
          "reconcile": { "prune": false }
        },

        "admin": {
          // Holding any of these opens /idp/admin and the admin API. `admin` and
          // `user` are the built-in catalog — this stack ships no roles.jsonc, so
          // every name here must come from it.
          "adminRoles": ["admin"],
          "allowImpersonation": false,

          // /idp/admin/database, a schema explorer and SQL console over THIS stack's
          // Postgres — the same instance pg_semantius lives in, so it reads the whole
          // cluster, not just the `idp` schema. "read-only" runs every statement in a
          // READ ONLY transaction: one statement per run, 10 s timeout, 500 rows, each
          // execution audited as `database.queried`. Useful here because this stack has
          // no other SQL console (psql is not exposed) — but an administrator who can
          // run SQL reads every row at rest, password hashes and session tokens
          // included. Set "disabled" to remove the page and both endpoints; going live
          // with untrusted administrators, do. "read-write" additionally commits.
          "database": "read-only"
        },

        "apiKeys": {
          // Per-user API keys at /idp/account/api-keys, exchangeable for a JWT at
          // GET /idp/api/auth/token with an `x-api-key` header — the scripted-access
          // path, and how you get a bearer token for curl without a browser.
          "enabled": true,
          "defaultExpiresIn": "365d",
          "maxExpiresIn": "730d",
          "tokenClientId": "idp",
          "tokenTtl": 3600
        },

        "session": {
          "expiresIn": "7d",
          "updateAge": "1d",
          "cookieCacheMinutes": 5,
          "revokeOAuthTokensOnLogout": false
        },

        "twoFactor": { "enabled": true, "trustDeviceDays": 30 },

        "rateLimit": { "enabled": true, "storage": "database" },

        // `json` for anything that collects logs — `docker compose logs idp` here.
        "logging": { "level": "info", "format": "json" },
        "cleanup": { "intervalMinutes": 60 },
        "audit": { "retentionDays": 90 }
      }
  idp_oauth_clients:
    content: |
      // OAuth clients of the bundled `idp` service. THIS FILE IS THE SOURCE OF TRUTH:
      // at every start the idp validates it and reconciles it into the database under
      // an advisory lock — missing clients are inserted, changed ones updated, and a
      // client no longer listed here is DISABLED (its tokens and consents revoked), or
      // deleted when `oauth.reconcile.prune` is true in config.jsonc. Dynamic client
      // registration is off and the client CRUD endpoints are unreachable, so adding an
      // application means adding it here and restarting the idp:
      //
      //   docker compose restart idp
      //
      // The same `$${env:NAME}` / `$${env:NAME:-default}` placeholders as config.jsonc
      // work here, resolved from the `idp` service's environment in
      // ../docker-compose.yml. The dokploy build EMBEDS this file into the generated
      // compose — regenerate after every change (../dokploy-build.sh).
      //
      // v1 supports the `authorization_code` (PKCE S256) and `refresh_token` grants
      // only. There is no `client_credentials`: for scripted access, issue yourself a
      // per-user API key at /idp/account/api-keys and exchange it for a JWT at
      // GET /idp/api/auth/token with an `x-api-key` header.
      {
        "clients": [
          {
            // The admin SPA — the `web` service, served at the front door's root. A
            // public client: no secret, PKCE S256 required.
            //
            // The id must match VITE_OAUTH_CLIENT_ID on the `web` service; both
            // default to `public-client`.
            "clientId": "public-client",
            "name": "Semantius Admin",
            "type": "spa",

            // EXACT match, no wildcards. The SPA builds its redirect URI as
            // `$${window.location.origin}/oauth2_callback`, so this has to be the
            // origin the browser actually uses — which is what PUBLIC_WEB_ORIGIN is
            // for (the caddy front door, no path, no trailing slash). Going live, set
            // PUBLIC_WEB_ORIGIN=https://yourdomain.com in .env; add a second entry
            // here if the same deployment is reached on more than one origin.
            "redirectUris": ["$${env:PUBLIC_WEB_ORIGIN:-http://localhost:3000}/oauth2_callback"],

            // Where the idp may send the browser after an RP-initiated logout. Three
            // entries because the SPA has three exits: its /logout route calls the
            // end-session endpoint with no redirect at all, its OAuth library falls
            // back to the redirect URI when no logout redirect is configured, and a
            // plain return lands on the app root.
            "postLogoutRedirectUris": [
              "$${env:PUBLIC_WEB_ORIGIN:-http://localhost:3000}/",
              "$${env:PUBLIC_WEB_ORIGIN:-http://localhost:3000}/logout-success",
              "$${env:PUBLIC_WEB_ORIGIN:-http://localhost:3000}/oauth2_callback"
            ],

            // Must be a subset of `oauth.scopes` in config.jsonc.
            "scopes": ["openid", "profile", "email", "offline_access"],

            // Needs at least one postLogoutRedirectUris entry, above.
            "enableEndSession": true
          }
        ]
      }
