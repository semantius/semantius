<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semantius - Migrate &amp; Refresh Cache</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 4px; }
    textarea, input[type="text"], input[type="password"] {
      width: 100%; box-sizing: border-box; padding: 8px;
      border: 1px solid #ccc; border-radius: 4px;
      font-family: monospace; font-size: 0.875rem; margin-bottom: 16px;
    }
    textarea { height: 80px; resize: vertical; }
    button {
      padding: 10px 24px; background: #2563eb; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    #response {
      margin-top: 24px; padding: 16px; background: #f8fafc;
      border: 1px solid #e2e8f0; border-radius: 4px;
      white-space: pre-wrap; font-family: monospace; font-size: 0.875rem;
      display: none;
    }
    #response.error { border-color: #fca5a5; background: #fff1f2; }
    #response.success { border-color: #86efac; background: #f0fdf4; }
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
    .tabs button { background: #e2e8f0; color: #334155; border-radius: 4px 4px 0 0; }
    .tabs button.active { background: #2563eb; color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>
  <h1>Semantius - Migrate &amp; Refresh Cache</h1>

  <div class="tabs">
    <button type="button" class="active" data-tab="migrate">Migrate</button>
    <button type="button" data-tab="refresh">Reset Cache</button>
  </div>

  <!-- Migrate Tab -->
  <div id="tab-migrate" class="tab-content active">
    <form id="form-migrate">
      <label for="migrate_api_key">API Key</label>
      <input type="password" id="migrate_api_key" name="migrate_api_key" placeholder="Enter NEON_PROVISIONER_API_KEY" />

      <label for="database_url">Database URL</label>
      <textarea id="database_url" name="database_url" placeholder="postgresql://user:password@host:5432/database"></textarea>

      <label for="modules">Modules <small style="font-weight:normal">(comma-separated, e.g. _core,nwind)</small></label>
      <input type="text" id="modules" name="modules" placeholder="_core" />

      <button type="submit" id="submit-migrate">Migrate</button>
    </form>
  </div>

  <!-- Reset Cache Tab -->
  <div id="tab-refresh" class="tab-content">
    <form id="form-refresh">
      <label for="refresh_api_key">API Key</label>
      <input type="password" id="refresh_api_key" name="refresh_api_key" placeholder="Enter NEON_PROVISIONER_API_KEY" />

      <label for="project_id">Project ID <small style="font-weight:normal">(required)</small></label>
      <input type="text" id="project_id" name="project_id" placeholder="e.g. morning-lake-12345678" />

      <label for="branch_id">Branch ID <small style="font-weight:normal">(required)</small></label>
      <input type="text" id="branch_id" name="branch_id" placeholder="e.g. br-cool-name-12345678" />

      <label for="database_name">Database Name <small style="font-weight:normal">(required)</small></label>
      <input type="text" id="database_name" name="database_name" placeholder="e.g. neondb" />

      <label for="refresh_database_url">Database URL <small style="font-weight:normal">(required)</small></label>
      <textarea id="refresh_database_url" name="refresh_database_url" placeholder="postgresql://user:password@host:5432/database"></textarea>

      <button type="submit" id="submit-refresh">Reset Cache</button>
    </form>
  </div>

  <div id="response"></div>

  <script>
    // Tab switching
    document.querySelectorAll('.tabs button').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tabs button').forEach(function(b) { b.classList.remove('active'); });
        document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        clearResponse();
      });
    });

    function clearResponse() {
      var el = document.getElementById('response');
      el.style.display = 'none';
      el.textContent = '';
      el.className = '';
    }

    function showResponse(data, isError, elapsedMs) {
      var el = document.getElementById('response');
      var prefix = '// Completed in ' + elapsedMs + ' ms\n';
      el.textContent = prefix + JSON.stringify(data, null, 2);
      el.className = isError ? 'error' : 'success';
      el.style.display = 'block';
    }

    function setButtonState(btn, loading) {
      if (loading) {
        btn.dataset.originalText = btn.textContent;
        btn.textContent = 'Working...';
        btn.disabled = true;
      } else {
        btn.textContent = btn.dataset.originalText || btn.textContent;
        btn.disabled = false;
      }
    }

    function parseModules(raw) {
      return raw ? raw.split(',').map(function(m) { return m.trim(); }).filter(function(m) { return m.length > 0; }) : [];
    }

    // Migrate form
    document.getElementById('form-migrate').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submit-migrate');
      clearResponse();
      setButtonState(btn, true);
      var start = performance.now();

      var apiKey = document.getElementById('migrate_api_key').value.trim();
      var databaseUrl = document.getElementById('database_url').value.trim();
      var modules = parseModules(document.getElementById('modules').value.trim());

      try {
        var res = await fetch('/migrate', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({ database_url: databaseUrl, modules: modules })
        });
        var data = await res.json();
        showResponse(data, !data.success, Math.round(performance.now() - start));
      } catch (err) {
        showResponse({ error: 'Request failed: ' + (err instanceof Error ? err.message : String(err)) }, true, Math.round(performance.now() - start));
      } finally {
        setButtonState(btn, false);
      }
    });

    // Reset Cache form
    document.getElementById('form-refresh').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submit-refresh');
      clearResponse();
      setButtonState(btn, true);
      var start = performance.now();

      var apiKey = document.getElementById('refresh_api_key').value.trim();
      var projectId = document.getElementById('project_id').value.trim();
      var branchId = document.getElementById('branch_id').value.trim();
      var databaseName = document.getElementById('database_name').value.trim();
      var databaseUrl = document.getElementById('refresh_database_url').value.trim();

      try {
        var res = await fetch('/refresh_cache', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify({
            project_id: projectId,
            branch_id: branchId,
            database_name: databaseName,
            database_url: databaseUrl
          })
        });
        var data = await res.json();
        showResponse(data, !data.success, Math.round(performance.now() - start));
      } catch (err) {
        showResponse({ error: 'Request failed: ' + (err instanceof Error ? err.message : String(err)) }, true, Math.round(performance.now() - start));
      } finally {
        setButtonState(btn, false);
      }
    });
  </script>
</body>
</html>
