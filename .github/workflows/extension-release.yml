name: Release extension

# Publishes the Semantius core PostgreSQL extension as a GitHub Release.
# The tag is the repo-wide version (one version for every artifact in this repo), so
# it is an unprefixed `v<version>` — trigger by pushing a tag like `v0.2.0`, or run
# manually with a version.
# The same `pg_semantic_platform-<version>.zip` it attaches is also a valid PGXN distribution
# archive (it contains META.json) — publish it to PGXN with `pgxn release` (see the
# top-level README) or upload at manager.pgxn.org.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version, e.g. 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved extension version: $V"

      - name: Generate extension
        run: deno task extension "${{ steps.ver.outputs.version }}"

      - name: Package PGXN-style archive
        run: |
          V="${{ steps.ver.outputs.version }}"
          DIST="pg_semantic_platform-$V"
          mkdir -p "$DIST"
          cp extension/META.json \
             extension/pg_semantic_platform.control \
             extension/Makefile \
             extension/README.md \
             "$DIST/"
          # All install scripts: the current full install + the whole upgrade
          # chain, so `make install` + `ALTER EXTENSION ... UPDATE` both work.
          cp extension/pg_semantic_platform--*.sql "$DIST/"
          zip -r "$DIST.zip" "$DIST"
          echo "Built $DIST.zip:"
          unzip -l "$DIST.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          cat > notes.md <<EOF
          PostgreSQL extension build of **Semantius core v$V**.

          **Install**
          - PGXN: \`pgxn install pg_semantic_platform\`
          - From this release: download \`pg_semantic_platform-$V.zip\`, unzip, run \`make install\`, then \`CREATE EXTENSION pg_semantic_platform CASCADE;\` (PostgreSQL 18, superuser).

          \`pg_semantic_platform-$V.zip\` is also the PGXN distribution archive (contains META.json).
          EOF
          # Re-release support: drop any existing release for this tag so the
          # assets are replaced cleanly (gh release create fails if it exists).
          # Only the release + its assets are removed; the git tag is kept.
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            "pg_semantic_platform-$V.zip" \
            "extension/pg_semantic_platform--$V.sql" \
            extension/pg_semantic_platform.control \
            --title "Semantius extension v$V" \
            --notes-file notes.md
