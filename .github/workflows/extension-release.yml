name: Release extension

# Publishes the Semantius core PostgreSQL extension as a GitHub Release.
# The tag is the repo-wide version (one version for every artifact in this repo), so
# it is an unprefixed `v<version>` — trigger by pushing a tag like `v0.3.0`, or run
# manually with a version.
# The same `pg_semantius-<version>.zip` it attaches is also a valid PGXN
# distribution archive (it contains META.json). PGXN is never published from here:
# a release there is permanent, so it is a separate manual step that uploads THIS
# artifact — `./scripts/pgxn-release.sh <version>`. See RELEASE.md.
#
# Releases are cut with `./release.sh <version>`, which verifies and
# tests locally, then tags and pushes; this workflow re-runs everything from a
# clean checkout and publishes.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Extension version, e.g. 0.3.0"
        required: true

permissions:
  contents: write
  packages: write   # push the DB image to GHCR

jobs:
  # The pg_semantius binaries. A separate job so the five cross-compiles run
  # while nothing else is waiting on them, and so the Windows smoke test below
  # has an artifact to download.
  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Pinned, not v2.x: aarch64-pc-windows-msvc is a compile target only
          # from 2.9.3 on, and a floating runtime would silently change which
          # compiler produced the published binaries.
          deno-version: v2.9.6

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      # cli.ts imports this file, so the version it reports is whatever was
      # committed - not the tag. release.sh writes both; this is what makes a
      # tag moved by hand fail loudly instead of shipping a binary that lies
      # about which release it is.
      - name: packages/cli/deno.json must carry the released version
        run: |
          V="${{ steps.ver.outputs.version }}"
          IN_FILE="$(jq -r .version packages/cli/deno.json)"
          if [ "$IN_FILE" != "$V" ]; then
            echo "::error::packages/cli/deno.json says $IN_FILE but this release is $V; run ./release.sh $V, which writes the version and commits it"
            exit 1
          fi
          echo "packages/cli/deno.json is at $V"

      - name: Build every target
        run: deno task build-cli:all

      # The binary reads the SQL embedded in it, never the working directory,
      # so it is smoke-tested from a directory that has no apps/ at all. Byte
      # equality with the checkout's own output is what proves the embedded
      # copy is the tagged SQL and not something stale.
      - name: Smoke test (Linux)
        run: |
          V="${{ steps.ver.outputs.version }}"
          chmod +x dist/pg_semantius-cli-linux-x64
          GOT="$(dist/pg_semantius-cli-linux-x64 --version)"
          [ "$GOT" = "pg_semantius $V" ] || { echo "::error::--version printed \"$GOT\", expected \"pg_semantius $V\""; exit 1; }

          deno task migrate --apps _core --script >/dev/null
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/dist/pg_semantius-cli-linux-x64" migrate --apps _core --script --verbose > verbose.log
          if grep -q '(cwd)' verbose.log || [ "$(grep -c 'SQL apps root:' verbose.log)" != "1" ]; then
            grep 'SQL apps root:' verbose.log
            echo "::error::the binary must read only its embedded apps/ when the working directory has none"
            exit 1
          fi
          cmp migrate.sql "$GITHUB_WORKSPACE/migrate.sql" \
            || { echo "::error::the SQL embedded in the binary differs from the checkout's"; exit 1; }
          echo "embedded SQL matches the checkout"
          cp migrate.sql "$GITHUB_WORKSPACE/dist/migrate.sql"

      # Bare names, no directory prefix: both installers look the asset up in
      # this file by the exact name they downloaded.
      - name: Checksums
        run: |
          cd dist
          sha256sum pg_semantius-cli-* > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cli-binaries
          path: dist/
          # The binaries are already compressed executables; re-compressing
          # 400 MB of them costs minutes and saves nothing.
          compression-level: 0

  # The only place the cross-compiled Windows binary is ever run. A Windows
  # executable built on Linux resolves its embedded files through a path shape
  # nothing else in this repository exercises, and getting that wrong produces
  # a binary that works everywhere it was tested and nowhere it was shipped.
  smoke-windows:
    needs: build-cli
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Smoke test (Windows)
        run: |
          V="${{ steps.ver.outputs.version }}"
          GOT="$(dist/pg_semantius-cli-windows-x64.exe --version)"
          [ "$GOT" = "pg_semantius $V" ] || { echo "::error::--version printed \"$GOT\", expected \"pg_semantius $V\""; exit 1; }

          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          "$GITHUB_WORKSPACE/dist/pg_semantius-cli-windows-x64.exe" migrate --apps _core --script
          cmp migrate.sql "$GITHUB_WORKSPACE/dist/migrate.sql" \
            || { echo "::error::the Windows binary produced different SQL from the Linux one"; exit 1; }
          echo "the Windows binary reads its embedded apps/ correctly"

  release:
    needs: [build-cli, smoke-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Same pin as build-cli, so one runtime produces the whole release.
          deno-version: v2.9.6

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved extension version: $V"

      # The Postgres major in the image tags comes from the Dockerfile's FROM
      # line, so a base bump (postgres:18 -> :19) moves the tags with it and the
      # suffix can never claim a major the image does not actually have.
      - name: Resolve Postgres major
        id: pg
        run: |
          M="$(sed -nE 's|^FROM postgres:([0-9]+).*|\1|p' docker-postgres/Dockerfile | head -1)"
          [ -n "$M" ] || { echo "could not parse the Postgres major from docker-postgres/Dockerfile" >&2; exit 1; }
          echo "major=$M" >> "$GITHUB_OUTPUT"
          echo "Resolved Postgres major: $M"

      - name: Generate extension
        run: deno task extension "${{ steps.ver.outputs.version }}"
        # No --strict: the released-migration check is on by default now. A
        # migration a PREVIOUS version shipped may not be edited in place or
        # deleted - such a change is invisible to the upgrade script, so an
        # existing installation would never receive it. Only migrations ADDED
        # in this version are editable. To hot-patch an inherited one on
        # purpose, add --allow-edited-migrations for that one release.

      # The step above REGENERATES extension/ on the runner. Without this guard
      # the release would publish whatever the runner produced, which is not
      # necessarily the build that was tested locally (`pg-cli-retest.sh`,
      # `pg-ext-retest.sh`, `pg-ext-lifecycle.sh`). Failing here means the
      # committed extension/ is stale or was generated for a different version:
      # ./release.sh <version> does all of that in the right order;
      # this failing means the tag was moved without it.
      # `git status --porcelain`, not `git diff`: the generator also WRITES new
      # upgrade scripts and PRUNES the ones the manifest no longer accounts
      # for, and a plain diff sees neither an untracked file nor a deletion
      # that was never committed.
      - name: Committed build must equal the regenerated one
        run: |
          if [ -n "$(git status --porcelain -- extension/)" ]; then
            git status --porcelain -- extension/
            git diff -- extension/ || true
            echo '::error::extension/ differs from the regenerated build; run `./release.sh ${{ steps.ver.outputs.version }}` locally, which regenerates, tests, commits and moves the tag in the right order'
            exit 1
          fi
          echo "extension/ matches the regenerated build"

      # Checked out from a Windows repo, the harness scripts arrive as mode
      # 100644 and will not run. `bash <script>` at the top level would not be
      # enough either: pg-ext-retest.sh invokes ./pg-ext-create.sh itself.
      # Harmless if the modes are ever fixed in git.
      - name: Make the harness scripts executable
        run: chmod +x pgdocker/*.sh scripts/*.sh

      # The suite runs here, against the tag, not in a separate workflow and not
      # on a pull request: a tag is a commit by definition, so this is the first
      # moment the artifact about to be published actually exists. Both harnesses
      # are non-interactive and self-provisioning (pg-ext-create.sh copies
      # .env.example to .env), and both start with `down -v`, so a runner needs
      # no setup beyond Docker and Deno.
      #
      # Path B is the gate: it installs the extension that is about to ship.
      # Path A is what Path B is compared against — if they diverge, the
      # "extension-installed _core == migrate-installed _core" promise is broken
      # and the release must not go out.
      #
      # Cost: the base image compiles pg_oidc_validator from GitHub, so a
      # release depends on that repo and on apt.postgresql.org being reachable.
      # If the suite fails, no release and no image are published; fix, and move
      # the tag.
      - name: Suite on the extension install (Path B)
        run: ./pgdocker/pg-ext-retest.sh

      - name: Suite on the migrate install (Path A)
        run: ./pgdocker/pg-cli-retest.sh

      # Both suites run inside a single database. This proves what they cannot
      # see: the single-pass restore, DROP EXTENSION safety, and the refusals.
      - name: Extension lifecycle (install, dump/restore, drop, uninstall)
        run: ./pgdocker/pg-ext-lifecycle.sh

      # pgxn_meta ships as a RUBY gem (pgxn_utils), not a PyPI package, so the
      # spec validator is installed with gem. Whether or not it is available,
      # the checks below always run: they assert the four specific defects that
      # open item B10 named, which a generic spec validation would not catch.
      # One definition of the checks, shared with release.sh and
      # scripts/pgxn-release.sh, so CI and the local scripts cannot drift.
      - name: Validate the PGXN manifest
        run: |
          gem install --no-document pgxn_utils >/dev/null 2>&1 || true
          bash scripts/check-pgxn-meta.sh extension/META.json

      - name: Package PGXN-style archive
        run: |
          V="${{ steps.ver.outputs.version }}"
          DIST="pg_semantius-$V"
          mkdir -p "$DIST"
          # The file set comes from extension/versions.json via
          # scripts/archive-manifest.sh, not from a pg_semantius--*.sql
          # glob: a glob would ship any upgrade script sitting in
          # extension/, offering PostgreSQL an update path nobody
          # generated a migration set for, and the archive cannot be
          # recalled once it reaches PGXN. --check makes that an error
          # instead of a silent omission. The generator prunes such a file
          # in the first place; this is the last guard before publication.
          # Written to a file, not piped: the default shell here is `bash -e`
          # without pipefail, so a failing archive-manifest.sh at the head of a
          # pipeline would be masked by the exit status of the loop.
          bash scripts/archive-manifest.sh "$V" --check > archive-manifest.txt
          while read -r src name; do
            cp "$src" "$DIST/$name"
          done < archive-manifest.txt
          rm -f archive-manifest.txt
          zip -r "$DIST.zip" "$DIST"
          echo "Built $DIST.zip:"
          unzip -l "$DIST.zip"

      - uses: actions/download-artifact@v4
        with:
          name: cli-binaries
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          # The smoke test's output travels in the same artifact as the
          # binaries; it is evidence, not a release asset.
          rm -f dist/migrate.sql
          cat > notes.md <<EOF
          PostgreSQL extension build of **Semantius core v$V**.

          **Install**
          - PGXN: \`pgxn install pg_semantius\`
          - From this release: download \`pg_semantius-$V.zip\`, unzip, run \`make install\`.

          Then, in the target database (PostgreSQL 18, superuser, UTF8), **two statements and no \`CASCADE\`**:

          \`\`\`sql
          CREATE EXTENSION pg_semantius;
          SELECT semantius.migrate();
          \`\`\`

          \`CREATE EXTENSION\` creates only the cluster roles, the \`semantius\` schema and its functions; \`semantius.migrate()\` installs the core schema as ordinary objects, which is what makes a plain \`pg_dump\`, a single-pass \`pg_restore\` and a harmless \`DROP EXTENSION\` work.

          \`pg_semantius-$V.zip\` is also the PGXN distribution archive (contains META.json).

          ## Install the CLI

          A single self-contained \`pg_semantius\` executable. No Deno, no checkout; it carries the \`_core\`, \`nwind\` and \`test\` SQL of this release.

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/semantius/semantius/main/install.sh | bash
          \`\`\`

          \`\`\`powershell
          irm https://raw.githubusercontent.com/semantius/semantius/main/install.ps1 | iex
          \`\`\`

          Or download one directly: \`pg_semantius-cli-linux-x64\`, \`pg_semantius-cli-linux-arm64\`, \`pg_semantius-cli-darwin-arm64\` (Apple Silicon), \`pg_semantius-cli-windows-x64.exe\`, \`pg_semantius-cli-windows-arm64.exe\`; \`checksums.txt\` covers all five.

          The \`-cli-\` in those names separates them from the extension assets above; the installed command is still \`pg_semantius\`. Releases up to v0.5.0-beta1 published them without the infix.
          EOF
          # Re-release support: drop any existing release for this tag so the
          # assets are replaced cleanly (gh release create fails if it exists).
          # Only the release + its assets are removed; the git tag is kept.
          gh release delete "$TAG" --yes || true
          # Created as a DRAFT, then filled, then published. A draft never moves
          # `releases/latest`, and both install one-liners resolve through that
          # pointer - so an upload that fails halfway leaves the previous
          # release installable instead of 404ing every `curl | bash`.
          #
          # This protects a NEW tag only. On the re-release path the delete
          # above has already dropped the published release, so `latest` points
          # at the previous tag - which carries no pg_semantius binaries - for
          # the whole window. See RELEASE.md.
          gh release create "$TAG" --draft \
            "pg_semantius-$V.zip" \
            "extension/pg_semantius--$V.sql" \
            extension/pg_semantius.control \
            --title "Semantius extension v$V" \
            --notes-file notes.md
          gh release upload "$TAG" dist/pg_semantius-cli-* dist/checksums.txt --clobber
          gh release edit "$TAG" --draft=false

      # --- Publish the DB image (PostgreSQL 18 + extension) to GHCR -----------
      # The extension files were generated above, so the build context already
      # has them. Publishes ghcr.io/<owner>/postgres under three names for one
      # image: :<version>-pg<major> (canonical; moves while that version is the
      # newest build, frozen once a higher one is committed - see RELEASE.md),
      # :latest-pg<major>
      # (moving, major pinned) and :latest (moving, default major). There is
      # deliberately no bare :<version> — a version tag that silently changed
      # Postgres major later is exactly the ambiguity the suffix removes.
      # Consumed by the semantius-self-hosted stack and any Dokploy template.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The generator's superseded-version guard cannot fire here: this job checks
      # out THE TAG, and the manifest travels with the checkout, so re-releasing
      # v0.5.0 after 0.6.0 exists on main sees a versions.json holding only
      # 0.5.0. Decide from the tags instead, which are repo-wide. The
      # version-pinned :<ver>-pg<major> is always pushed - that is what makes a
      # re-release replace its own image - but the moving :latest* names are
      # only published when this really is the highest released version.
      - name: Resolve image tags
        id: imgtags
        env:
          OWNER: ${{ github.repository_owner }}
          V: ${{ steps.ver.outputs.version }}
          M: ${{ steps.pg.outputs.major }}
        run: |
          . scripts/semver.sh
          git fetch --tags --force --quiet
          # A pre-release never moves :latest - :latest means the current stable
          # build. Otherwise ">= the highest FINAL tag". semver, not sort -V, so
          # cutting 0.6.0 after 0.6.0-rc1 does move it. Matches
          # docker-postgres/{build,publish}.sh.
          TOP="$(git tag -l 'v*' | semver_finals | semver_max_of)"
          if semver_is_prerelease "$V"; then
            HIGHEST=0
            WHY="$V is a pre-release"
          elif [ -z "$TOP" ] || [ "$(semver_cmp "$V" "$TOP")" != "-1" ]; then
            HIGHEST=1
          else
            HIGHEST=0
            WHY="$TOP is newer"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "ghcr.io/$OWNER/postgres:$V-pg$M"
            if [ "$HIGHEST" = "1" ]; then
              echo "ghcr.io/$OWNER/postgres:latest-pg$M"
              echo "ghcr.io/$OWNER/postgres:latest"
            fi
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$HIGHEST" = "1" ]; then
            echo "$V is the highest released version; :latest will move"
          else
            echo "::notice::publishing the version-pinned image only ($WHY); :latest stays where it is"
          fi

      - name: Build and push DB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-postgres/Dockerfile
          push: true
          tags: ${{ steps.imgtags.outputs.tags }}
