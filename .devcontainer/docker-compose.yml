# Devcontainer stack: the dev tools container (`app`) + a local PostgreSQL 18
# server (`db`) built from ../pgdocker. This lets the whole project run with no
# Neon/Supabase account — DATABASE_URL points at `db`.
#
# Paths are relative to THIS file (.devcontainer/), hence ../pgdocker/...
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/semantius-core:cached
    environment:
      # Default to the local db service; override by exporting DATABASE_URL on
      # the host before opening the devcontainer (e.g. to target Neon instead).
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/appdb}
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: ../pgdocker
      args:
        OIDC_VALIDATOR_REF: ${OIDC_VALIDATOR_REF:-72a35e90e4297221142e1d6b1dd3bcf5fabbe3fc}
    image: postgres18-oauth:local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    # Publish to the host too, so host-side tools / psql can reach it.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../pgdocker/conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../pgdocker/conf/pg_ident.conf:/etc/postgresql/pg_ident.conf:ro
      - ../pgdocker/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "oauth_validator_libraries=pg_oidc_validator"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
      - "-c"
      - "ident_file=/etc/postgresql/pg_ident.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
